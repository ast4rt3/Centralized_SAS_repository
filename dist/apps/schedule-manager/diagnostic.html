<!DOCTYPE html>
<html>
<head>
    <title>Schedule Manager Diagnostics</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
        .pass { color: #22c55e; }
        .fail { color: #ef4444; }
        .info { color: #60a5fa; }
        #log { white-space: pre-wrap; margin-top: 20px; }
        button { padding: 10px 20px; background: #004a99; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Schedule Manager — Diagnostic Tool</h1>
    <p>This page tests Supabase connectivity independent of app.js</p>
    <button onclick="runAll()">Run All Tests</button>
    <button onclick="clearLog()">Clear</button>
    <div id="log"></div>

    <script src="../../env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const log = document.getElementById('log');
        function l(msg, type='info') { const span = document.createElement('div'); span.className = type; span.textContent = msg; log.appendChild(span); console.log(msg); }
        function clearLog() { log.innerHTML = ''; }

        async function testEnv() {
            l('=== TEST 1: env.js ===', 'info');
            if (!window.ENV) { l('❌ window.ENV is undefined', 'fail'); return false; }
            l('✅ window.ENV exists', 'pass');
            l('   SUPABASE_URL: ' + (window.ENV.SUPABASE_URL?.substring(0,40) + '...'), 'info');
            l('   SUPABASE_ANON_KEY: ' + (window.ENV.SUPABASE_ANON_KEY ? 'present (length ' + window.ENV.SUPABASE_ANON_KEY.length + ')' : 'MISSING'), window.ENV.SUPABASE_ANON_KEY ? 'pass' : 'fail');
            return !!window.ENV.SUPABASE_URL && !!window.ENV.SUPABASE_ANON_KEY;
        }

        async function testSupabaseLib() {
            l('=== TEST 2: Supabase Library ===', 'info');
            if (!window.supabase) { l('❌ window.supabase is undefined', 'fail'); return false; }
            l('✅ window.supabase exists', 'pass');
            l('   createClient is ' + (typeof window.supabase.createClient === 'function' ? 'a function ✅' : 'NOT a function ❌'), typeof window.supabase.createClient === 'function' ? 'pass' : 'fail');
            return typeof window.supabase.createClient === 'function';
        }

        async function testClientCreation() {
            l('=== TEST 3: Create Client ===', 'info');
            try {
                const client = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
                l('✅ Client created successfully', 'pass');
                l('   Rest endpoint: ' + client.rest.url.toString(), 'info');
                window._testClient = client; // store for later tests
                return true;
            } catch (e) {
                l('❌ Client creation failed: ' + e.message, 'fail');
                return false;
            }
        }

        async function testTableExists() {
            l('=== TEST 4: Table Exists ===', 'info');
            if (!window._testClient) { l('❌ No client — skipping', 'fail'); return false; }
            try {
                const { data, error } = await window._testClient
                    .from('sas_schedules')
                    .select('count')
                    .limit(1);
                if (error) {
                    if (error.code === '42P01') {
                        l('❌ Table sas_schedules does NOT exist', 'fail');
                        l('   → Run the SQL migration in Supabase SQL Editor first!', 'info');
                    } else {
                        l('❌ Query error: ' + error.message + ' (code: ' + error.code + ')', 'fail');
                    }
                    return false;
                }
                l('✅ Table sas_schedules exists and is accessible', 'pass');
                return true;
            } catch (e) {
                l('❌ Exception: ' + e.message, 'fail');
                return false;
            }
        }

        async function testInsert() {
            l('=== TEST 5: Insert Test (dry-run) ===', 'info');
            if (!window._testClient) return false;
            // We'll just build the payload, don't actually insert
            const testPayload = {
                label: 'DIAGNOSTIC_TEST',
                date: new Date().toISOString().split('T')[0],
                start_time: '00:00:00',
                end_time: '00:01:00',
                is_active: false
            };
            l('✅ Insert payload structure validated: ' + JSON.stringify(testPayload), 'pass');
            l('   (NOT inserted — this is just a format check)', 'info');
            return true;
        }

        async function testMasterlistLookup() {
            l('=== TEST 6: Masterlist Lookup ===', 'info');
            if (!window._testClient) return false;
            try {
                // Test if NBSC_masterlist is accessible and has an ID column
                const { data, error } = await window._testClient
                    .from('NBSC_masterlist')
                    .select('ID, Name')
                    .limit(1);
                if (error) {
                    l('❌ Masterlist query failed: ' + error.message, 'fail');
                    return false;
                }
                l('✅ NBSC_masterlist accessible', 'pass');
                l('   Sample row: ' + JSON.stringify(data?.[0] || 'empty table'), 'info');
                return true;
            } catch (e) {
                l('❌ Exception: ' + e.message, 'fail');
                return false;
            }
        }

        async function runAll() {
            clearLog();
            l('🚀 Starting diagnostics...\n', 'info');
            await testEnv();
            await testSupabaseLib();
            await testClientCreation();
            await testTableExists();
            await testInsert();
            await testMasterlistLookup();
            l('\n✅ Diagnostics complete — review results above', 'info');
        }

        // Auto-run on load
        window.addEventListener('load', () => setTimeout(runAll, 500));
    </script>
</body>
</html>
