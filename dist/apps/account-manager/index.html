<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Trailing Slash Fix: Ensures relative paths work correctly while preserving query parameters
    (function () {
      const url = new URL(window.location.href);
      if (!url.pathname.endsWith('/') && !url.pathname.endsWith('.html')) {
        url.pathname += '/';
        window.location.replace(url.toString());
      }
    })();
  </script>
  <title>Account Approval Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    :root {
      --nbsc-blue: #004a99;
      --nbsc-dark: #001a33;
      --nbsc-mid: #003366;
      --nbsc-gold: #f0ad4e;
      --bg-main: #f0f2f5;
      --bg-card: #ffffff;
      --border: rgba(0, 26, 51, 0.12);
      --text: #0b1220;
      --text-muted: rgba(0, 26, 51, 0.7);
      --shadow-soft: 0 4px 15px rgba(0, 0, 0, 0.08);
      --success: #22c55e;
      --danger: #ef4444;
      --font-sans: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 16px 60px;
      background: linear-gradient(135deg, var(--nbsc-mid) 0%, var(--nbsc-dark) 100%);
      color: #ffffff;
      box-shadow: var(--shadow-soft);
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo {
      width: 44px;
      height: auto;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .header-text h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-text p {
      margin: 2px 0 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--nbsc-gold);
    }

    .app-content {
      flex: 1;
      padding: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      flex: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-soft);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .stat-pending .stat-icon {
      background: rgba(240, 173, 78, 0.1);
      color: var(--nbsc-gold);
    }

    .stat-active .stat-icon {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }

    .stat-info h3 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--nbsc-dark);
    }

    .stat-info p {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .main-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafbfc;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      color: var(--nbsc-dark);
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--nbsc-mid);
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: #f1f5f9;
      border-color: var(--nbsc-blue);
    }

    .pending-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .user-row {
      display: grid;
      grid-template-columns: 60px 1fr 1fr 1fr 180px;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .user-row:hover {
      background: #f8fafc;
    }

    .user-row:last-child {
      border-bottom: none;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--nbsc-mid);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      overflow: hidden;
    }

    .user-info .name {
      font-weight: 700;
      color: var(--nbsc-dark);
      display: block;
    }

    .user-info .sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .role-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .role-admin {
      background: #fee2e2;
      color: #991b1b;
    }

    .role-scanner {
      background: #fef3c7;
      color: #92400e;
    }

    .role-user {
      background: #e0f2fe;
      color: #075985;
    }

    .action-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-approve {
      background: var(--success);
      color: white;
    }

    .btn-approve:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-reject {
      background: #f1f5f9;
      color: var(--danger);
      border: 1px solid var(--border);
    }

    .btn-reject:hover {
      background: #fee2e2;
      border-color: var(--danger);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .hidden {
      display: none !important;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--nbsc-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: white;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--nbsc-blue);
      transform: translateX(120%);
      animation: slideIn 0.3s forwards;
    }

    .toast-success {
      border-left-color: var(--success);
    }

    .toast-error {
      border-left-color: var(--danger);
    }

    @keyframes slideIn {
      to {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-brand">
        <img src="../../assets/sas_logo_real.png" class="header-logo" alt="NBSC Logo">
        <div class="header-text">
          <h1>User Account Manager</h1>
          <p>Admin Control Panel</p>
        </div>
      </div>
      <button id="refresh-all-btn" class="refresh-btn" style="color: white; border-color: rgba(255,255,255,0.3);">
        <i class='bx bx-refresh'></i> Refresh System
      </button>
    </header>

    <main class="app-content">
      <div class="stats-bar">
        <div class="stat-card stat-pending">
          <div class="stat-icon"><i class='bx bx-time-five'></i></div>
          <div class="stat-info">
            <h3 id="count-pending">0</h3>
            <p>Pending Requests</p>
          </div>
        </div>
        <div class="stat-card stat-active">
          <div class="stat-icon"><i class='bx bx-user-check'></i></div>
          <div class="stat-info">
            <h3 id="count-active">-</h3>
            <p>System Overview</p>
          </div>
        </div>
      </div>

      <div class="main-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class='bx bx-list-check'></i>
            Registration Requests
          </h2>
          <div id="loading-indicator" class="hidden">
            <div class="spinner" style="width:20px; height:20px; border-width:2px;"></div>
          </div>
        </div>

        <div class="pending-list" id="pending-list">
          <!-- User rows injected here -->
          <div class="empty-state" id="empty-state">
            <i class='bx bx-check-double'></i>
            <p>No pending registration requests.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <!-- SAS App Bridge -->
  <script type="module" src="../../src/utils/app-bridge.js"></script>
  <!-- App Logic -->
  <script type="module" src="./account_manager.js"></script>
</body>

</html>
