<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masterlist Data Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <!-- SAS App Bridge -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PapaParse for parsing CSV files natively in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- PDF.js for parsing PDF masterlists -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <style>
    :root {
      --error: #ef4444;
    }

    body {
      background: var(--bg-main);
      padding: 24px;
      margin: 0;
      min-height: 100vh;
      display: block; /* Override default flex from global body if needed inside iframe */
    }

    .manager-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--nbsc-blue);
    }

    .header-text h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--nbsc-dark);
    }

    .header-text p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f1f5f9;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .toggle-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--nbsc-dark);
      text-transform: uppercase;
    }

    /* Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--error); /* Default (unchecked): Production Mode (Danger color) */
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--nbsc-gold); /* Checked: Test Mode (Warning color) */
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .mode-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 800;
    }
    .badge-test { background: #fef08a; color: #854d0e; }
    .badge-prod { background: #fecdd3; color: #9f1239; }

    .upload-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      border: 2px dashed #cbd5e1;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upload-card.drag-over {
      background: #f0f7ff;
      border-color: var(--nbsc-blue);
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 3.5rem;
      color: var(--nbsc-blue);
      margin-bottom: 16px;
    }

    .upload-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--nbsc-dark);
      margin-bottom: 8px;
    }

    .upload-subtext {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    .preview-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: var(--shadow-soft);
      display: none; /* Hidden until file loaded */
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .preview-stats {
      font-weight: 600;
      color: var(--nbsc-blue);
    }

    .action-btn {
      background: var(--nbsc-blue, #004a99);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-sans, sans-serif);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }

    .action-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .table-container {
      overflow-x: auto;
      max-height: 400px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: #f8fafc;
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: var(--nbsc-dark);
      position: sticky;
      top: 0;
      border-bottom: 2px solid #e2e8f0;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      color: var(--text);
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    /* Logs */
    .log-container {
      margin-top: 24px;
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      height: 200px;
      overflow-y: auto;
      display: none;
    }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .log-info { color: #94a3b8; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .header-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .toggle-container {
        width: 100%;
        box-sizing: border-box;
        justify-content: space-between;
      }
      .preview-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .action-btn {
        width: 100%;
        justify-content: center;
      }
      .upload-card {
        padding: 24px 16px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/masterlistManager-DxcIp9kp.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-iJ-6Fn-a.js">
  <link rel="modulepreload" crossorigin href="/assets/app-bridge-B65APBmf.js">
  <link rel="stylesheet" crossorigin href="/assets/masterlistManager-D1xoctvD.css">
</head>
<body>

  <div class="manager-container">
    
    <div class="header-card">
      <div class="header-text">
        <h1>Masterlist Data Manager</h1>
        <p>Bulk import student records via CSV or JSON.</p>
      </div>
      
      <div class="toggle-container">
        <span class="toggle-label">Target Database:</span>
        <span class="mode-badge badge-test" id="modeBadge">TEST MODE</span>
        <label class="switch" title="Toggle between Test and Production Database">
          <input type="checkbox" id="dbToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="upload-card" id="dropZone">
      <i class='bx bx-cloud-upload upload-icon'></i>
      <div class="upload-text">Drag & Drop your CSV or JSON file here</div>
      <div class="upload-subtext">or click to browse from your computer</div>
      <input type="file" id="fileInput" accept=".csv,.json,.pdf">
    </div>

    <div class="preview-card" id="previewCard">
      <div class="preview-header">
        <div class="preview-stats">
          <i class='bx bx-file'></i> <span id="fileName">data.csv</span> 
          (<span id="rowCount">0</span> records found)
        </div>
        <button class="action-btn" id="uploadBtn" disabled>
          <i class='bx bx-cloud-upload'></i> Start Upload (TEST)
        </button>
      </div>

      <div class="table-container">
        <table id="previewTable">
          <thead>
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="log-container" id="logContainer"></div>

  </div>

</body>
</html>
