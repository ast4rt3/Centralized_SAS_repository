name: NBSC SAS CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. BUILD STAGE
  build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Generate .env from Secrets
        run: |
          echo "VITE_BACKEND_GAS_URL=\"${{ secrets.BACKEND_GAS_URL }}\"" > .env
          echo "VITE_YOUTUBE_PROXY_URL=\"${{ secrets.YOUTUBE_PROXY_URL }}\"" >> .env
          echo "VITE_CLOUDINARY_CLOUD_NAME=\"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"" >> .env
          echo "VITE_CLOUDINARY_UPLOAD_PRESET=\"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"" >> .env
          echo "VITE_SUPABASE_URL=\"${{ secrets.SUPABASE_URL }}\"" >> .env
          echo "VITE_SUPABASE_ANON_KEY=\"${{ secrets.SUPABASE_ANON_KEY }}\"" >> .env
          echo "VITE_SYSTEM_THEME=\"nbsc-modern\"" >> .env
          echo "VITE_TV_AUDIO_ENABLED=\"false\"" >> .env
          echo "VITE_TV_THEATER_MODE=\"false\"" >> .env


  # 2. AUTOMATED TESTS
  automated-tests:
    needs: build-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Run System Diagnostic
        run: node scripts/system-diagnostic.js

  # 3. CODE ANALYSIS AND SECURITY SCAN
  security-analysis:
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Syntax Check
        run: node scripts/ci-syntax-check.js
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scanners: 'secret,vuln,misconfig'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 4. ARTIFACT REPOSITORY (for audit/review purposes only)
  artifact-repository:
    needs: security-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-production-build
          path: |
            apps/
            assets/
            src/
            scripts/
            index.html
            styles.css
            manifest.json
            serviceWorker.js
            systems.json
            version.txt
            vercel.json
            env.example.js
            package.json
            package-lock.json

  # 5. DEPLOYMENT TO STAGING
  deployment-to-staging:
    needs: artifact-repository
    environment:
      name: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Run Staging Connection Audit
        env:
          VITE_BACKEND_GAS_URL: ${{ secrets.BACKEND_GAS_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/ci-connection-check.js

  # 6. DEPLOYMENT TO PRODUCTION
  # Uses a fresh checkout — avoids artifact extraction complexity entirely.
  # env.js is gitignored so it is regenerated here from secrets.
  deployment-to-production:
    needs: deployment-to-staging
    environment:
      name: production
      url: http://nbsc-sas.kesug.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate .env from Secrets
        run: |
          echo "VITE_BACKEND_GAS_URL=\"${{ secrets.BACKEND_GAS_URL }}\"" > .env
          echo "VITE_YOUTUBE_PROXY_URL=\"${{ secrets.YOUTUBE_PROXY_URL }}\"" >> .env
          echo "VITE_CLOUDINARY_CLOUD_NAME=\"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"" >> .env
          echo "VITE_CLOUDINARY_UPLOAD_PRESET=\"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"" >> .env
          echo "VITE_SUPABASE_URL=\"${{ secrets.SUPABASE_URL }}\"" >> .env
          echo "VITE_SUPABASE_ANON_KEY=\"${{ secrets.SUPABASE_ANON_KEY }}\"" >> .env
          echo "VITE_SYSTEM_THEME=\"nbsc-modern\"" >> .env
          echo "VITE_TV_AUDIO_ENABLED=\"false\"" >> .env
          echo "VITE_TV_THEATER_MODE=\"false\"" >> .env

      - name: Debug — Verify deployment files
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== apps/file-hub/ ==="
          ls -la apps/file-hub/
          echo ""
          echo "=== .env exists? ==="
          test -f .env && echo "YES — .env is present" || echo "NO — .env is MISSING"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build (Obfuscation)
        run: |
          npm ci
          npm run build
          echo "=== PRODUCTION READINESS CHECK ==="
          test -f dist/env.js && echo "✅ env.js present" || { echo "❌ env.js MISSING"; exit 1; }
          test -f dist/src/utils/app-bridge.js && echo "✅ app-bridge.js present" || { echo "❌ app-bridge.js MISSING"; exit 1; }
          test -f dist/apps/account-manager/account_manager.js && echo "✅ account_manager.js present" || { echo "❌ account_manager.js MISSING"; exit 1; }
          echo "=== BUILD COMPLETE: Listing dist contents ==="
          ls -R dist


      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './github-pages-redirect'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to InfinityFree FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./htdocs/
