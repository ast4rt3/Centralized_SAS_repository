name: NBSC SAS Industrial CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. BUILD STAGE
  build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Generate env.js from Secrets
        env:
          FIREBASE_CONFIG: "${{ secrets['FIREBASE_CONFIG'] }}"
        run: |
          echo "window.ENV = {" > env.js
          echo "  BACKEND_GAS_URL: \"${{ secrets.BACKEND_GAS_URL }}\"," >> env.js
          echo "  SCANNER_GAS_URL: \"${{ secrets.SCANNER_GAS_URL }}\"," >> env.js
          echo "  YOUTUBE_PROXY_URL: \"${{ secrets.YOUTUBE_PROXY_URL }}\"," >> env.js
          echo "  CLOUDINARY_CLOUD_NAME: \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"," >> env.js
          echo "  CLOUDINARY_UPLOAD_PRESET: \"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"," >> env.js
          echo "  SUPABASE_URL: \"${{ secrets.SUPABASE_URL }}\"," >> env.js
          echo "  SUPABASE_ANON_KEY: \"${{ secrets.SUPABASE_ANON_KEY }}\"," >> env.js
          echo "  FIREBASE_CONFIG: $FIREBASE_CONFIG," >> env.js
          echo "  SYSTEM_THEME: \"nbsc-modern\"," >> env.js
          echo "  TV_AUDIO_ENABLED: false," >> env.js
          echo "  TV_THEATER_MODE: false," >> env.js
          echo "  systems: $(cat systems.json || echo '[]')" >> env.js
          echo "};" >> env.js


  # 2. AUTOMATED TESTS
  automated-tests:
    needs: build-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Run System Diagnostic
        run: node scripts/system-diagnostic.js

  # 3. CODE ANALYSIS AND SECURITY SCAN
  security-analysis:
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Syntax Check
        run: node scripts/ci-syntax-check.js
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scanners: 'secret,vuln,misconfig'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 4. ARTIFACT REPOSITORY (for audit/review purposes only)
  artifact-repository:
    needs: security-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-production-build
          path: |
            apps/
            assets/
            src/
            scripts/
            index.html
            styles.css
            manifest.json
            serviceWorker.js
            systems.json
            version.json
            vercel.json
            env.example.js
            package.json
            package-lock.json

  # 5. DEPLOYMENT TO STAGING
  deployment-to-staging:
    needs: artifact-repository
    environment:
      name: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --omit=dev
      - name: Run Staging Connection Audit
        env:
          BACKEND_GAS_URL: ${{ secrets.BACKEND_GAS_URL }}
          SCANNER_GAS_URL: ${{ secrets.SCANNER_GAS_URL }}
        run: node scripts/ci-connection-check.js

  # 6. DEPLOYMENT TO PRODUCTION
  # Uses a fresh checkout — avoids artifact extraction complexity entirely.
  # env.js is gitignored so it is regenerated here from secrets.
  deployment-to-production:
    needs: deployment-to-staging
    environment:
      name: production
      url: http://nbsc-sas.kesug.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Finalize env.js
        env:
          FIREBASE_CONFIG: "${{ secrets['FIREBASE_CONFIG'] }}"
        run: |
          # Create a clean env.js. We use printf to avoid escaping issues with cat <<EOF
          echo "window.ENV = {" > env.js
          echo "  BACKEND_GAS_URL: \"${{ secrets.BACKEND_GAS_URL }}\"," >> env.js
          echo "  SCANNER_GAS_URL: \"${{ secrets.SCANNER_GAS_URL }}\"," >> env.js
          echo "  YOUTUBE_PROXY_URL: \"${{ secrets.YOUTUBE_PROXY_URL }}\"," >> env.js
          echo "  CLOUDINARY_CLOUD_NAME: \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"," >> env.js
          echo "  CLOUDINARY_UPLOAD_PRESET: \"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"," >> env.js
          echo "  SUPABASE_URL: \"${{ secrets.SUPABASE_URL }}\"," >> env.js
          echo "  SUPABASE_ANON_KEY: \"${{ secrets.SUPABASE_ANON_KEY }}\"," >> env.js
          echo "  FIREBASE_CONFIG: $FIREBASE_CONFIG," >> env.js
          echo "  SYSTEM_THEME: \"nbsc-modern\"," >> env.js
          echo "  TV_AUDIO_ENABLED: false," >> env.js
          echo "  TV_THEATER_MODE: false," >> env.js
          echo "  systems: $(cat systems.json || echo '[]')" >> env.js
          echo "};" >> env.js

      - name: Debug — Verify deployment files
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== apps/file-hub/ ==="
          ls -la apps/file-hub/
          echo ""
          echo "=== env.js exists? ==="
          test -f env.js && echo "YES — env.js is present" || echo "NO — env.js is MISSING"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build (Obfuscation)
        run: |
          npm ci
          npm run build
          echo "=== PRODUCTION READINESS CHECK ==="
          test -f dist/env.js && echo "✅ env.js present" || { echo "❌ env.js MISSING"; exit 1; }
          test -f dist/src/utils/app-bridge.js && echo "✅ app-bridge.js present" || { echo "❌ app-bridge.js MISSING"; exit 1; }
          test -f dist/apps/account-manager/account_manager.js && echo "✅ account_manager.js present" || { echo "❌ account_manager.js MISSING"; exit 1; }
          echo "=== BUILD COMPLETE: Listing dist contents ==="
          ls -R dist


      # - name: Setup Pages
      #   uses: actions/configure-pages@v4
      # - name: Upload Pages Artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: './dist'
      # - name: Deploy to GitHub Pages
      #   id: deployment
      #   uses: actions/deploy-pages@v4

      - name: Deploy to InfinityFree FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./htdocs/
