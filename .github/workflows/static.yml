name: NBSC SAS Industrial CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. BUILD STAGE
  build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: npm install
      
      - name: Generate env.js from Secrets
        run: |
          echo "window.ENV = {" > env.js
          echo "  BACKEND_GAS_URL: \"${{ secrets.BACKEND_GAS_URL }}\"," >> env.js
          echo "  SCANNER_GAS_URL: \"${{ secrets.SCANNER_GAS_URL }}\"," >> env.js
          echo "  YOUTUBE_PROXY_URL: \"${{ secrets.YOUTUBE_PROXY_URL }}\"," >> env.js
          echo "  CLOUDINARY_CLOUD_NAME: \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"," >> env.js
          echo "  CLOUDINARY_UPLOAD_PRESET: \"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"," >> env.js
          echo "  systems: $(cat systems.json)" >> env.js
          echo "};" >> env.js

  # 2. AUTOMATED TESTS
  automated-tests:
    needs: build-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: Run System Diagnostic
        run: node scripts/system-diagnostic.js

  # 3. CODE ANALYSIS AND SECURITY SCAN
  security-analysis:
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: npm install
      - name: Syntax Check
        run: node scripts/ci-syntax-check.js
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          security-checks: 'secret,vuln,misconfig'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 4. ARTIFACT REPOSITORY
  artifact-repository:
    needs: security-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Deployment Artifact
        run: |
          mkdir -p ../sas-build
          cp -r . ../sas-build/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-production-build
          path: ../sas-build/

  # 5. DEPLOYMENT TO STAGING
  deployment-to-staging:
    needs: artifact-repository
    environment:
      name: staging
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: sas-production-build
      - name: Run Staging Connection Audit
        env:
          BACKEND_GAS_URL: ${{ secrets.BACKEND_GAS_URL }}
          SCANNER_GAS_URL: ${{ secrets.SCANNER_GAS_URL }}
        run: node scripts/ci-connection-check.js

  # 6. DEPLOYMENT TO PRODUCTION
  deployment-to-production:
    needs: deployment-to-staging
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: sas-production-build
      # IMPORTANT: env.js needs to be regenerated in this job context because 
      # it wasn't part of the shared git repo (ignored)
      - name: Finalize env.js
        run: |
          echo "window.ENV = {" > env.js
          echo "  BACKEND_GAS_URL: \"${{ secrets.BACKEND_GAS_URL }}\"," >> env.js
          echo "  SCANNER_GAS_URL: \"${{ secrets.SCANNER_GAS_URL }}\"," >> env.js
          echo "  YOUTUBE_PROXY_URL: \"${{ secrets.YOUTUBE_PROXY_URL }}\"," >> env.js
          echo "  CLOUDINARY_CLOUD_NAME: \"${{ secrets.CLOUDINARY_CLOUD_NAME }}\"," >> env.js
          echo "  CLOUDINARY_UPLOAD_PRESET: \"${{ secrets.CLOUDINARY_UPLOAD_PRESET }}\"," >> env.js
          echo "  systems: $(cat systems.json)" >> env.js
          echo "};" >> env.js
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
