<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS File Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --accent: #FFD700;
            --bg-deep: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            
            /* Vibrant Button Palette from Home Screen */
            --btn-red: #dc2626;
            --btn-purple: #7c3aed;
            --btn-teal: #0d9488;
            --btn-gold: #f59e0b;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a 0%, #0f172a 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Overhaul */
        .app-header {
            padding: 30px 40px;
            padding-left: 90px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .header-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-brand h1 span { color: var(--accent); }

        .header-brand p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Vibrant Action Button */
        .btn-upload {
            background: var(--btn-gold);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
            filter: brightness(1.1);
        }

        /* Category Filter Bar (Vibrant Pill Style) */
        .filter-bar {
            padding: 25px 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-pill:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); }

        /* Specific Pill Colors like Home Screen */
        .filter-pill[data-cat="all"].active { background: var(--btn-gold); color: #0f172a; border-color: var(--btn-gold); }
        .filter-pill[data-cat="Personal"].active { background: var(--btn-purple); border-color: var(--btn-purple); }
        .filter-pill[data-cat="Official Documents"].active { background: var(--btn-teal); border-color: var(--btn-teal); }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 20px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Glass Card Overhaul */
        .file-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .file-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .file-icon-box {
            height: 120px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .category-tag {
            position: absolute; top: 12px; right: 12px;
            background: rgba(255,255,255,0.1);
            color: white; font-size: 9px; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .file-info h3 { 
            font-size: 16px; font-weight: 700; color: white; margin-bottom: 6px; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .file-info p { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }

        .file-footer { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-top: 18px; border-top: 1px solid var(--glass-border); 
        }

        .btn-action {
            width: 38px; height: 38px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border);
            cursor: pointer; transition: all 0.3s;
        }

        .btn-action:hover { background: var(--accent); color: #0f172a; transform: translateY(-3px); }
        .btn-action.delete:hover { background: var(--btn-red); color: white; border-color: var(--btn-red); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }

        .modal {
            background: #1e293b; border: 1px solid var(--glass-border);
            width: 90%; max-width: 450px; border-radius: 28px; padding: 40px;
        }

        .input-style {
            width: 100%; background: #0f172a; border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 14px; color: white; margin-top: 8px;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }

        .toast {
            background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); padding: 16px 24px;
            border-radius: 16px; color: white; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: translateX(120%); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--btn-teal); }
        .toast.error { border-left: 4px solid var(--btn-red); }

        /* Custom Confirm Modal */
        #confirm-modal .modal {
            max-width: 400px; text-align: center;
        }
        .confirm-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255,255,255,0.05); margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
        }


    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>
                <img src="../../assets/sas_logo_real.png" alt="SAS Logo" style="height: 42px; width: auto;">
                SAS <span>File Hub</span>
            </h1>
            <p>Your Personal Secure Cloud Storage</p>
        </div>
        <button class="btn-upload" id="open-upload-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3" stroke-linecap="round"/></svg>
            Upload File
        </button>
    </header>

    <div class="filter-bar">
        <div class="filter-pill active" data-cat="all" onclick="setFilter('all')">All Library</div>
        <div class="filter-pill" data-cat="Personal" onclick="setFilter('Personal')">Personal Storage</div>
        <div class="filter-pill" data-cat="Official Documents" onclick="setFilter('Official Documents')">Official Vault</div>
    </div>

    <main class="content-area">
        <div id="file-container">
            <div class="empty-state" style="text-align: center; padding-top: 100px; color: var(--text-muted);">
                <p>Establishing connection to Drive...</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 20px; color: var(--accent);">Upload to Vault</h2>
            <form id="upload-form">
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Select Category</label>
                    <select name="category" class="input-style" required>
                        <option value="Personal">Personal Storage</option>
                        <option value="Official Documents">Official Vault</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Choose Document</label>
                    <input type="file" name="file" class="input-style" required>
                </div>

                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px;">
                    <input type="checkbox" name="isPublic" id="isPublic" style="width:20px; height:20px; accent-color: var(--accent);">
                    <label for="isPublic" style="font-weight: 600; cursor: pointer;">Public Access (Allow anyone to view)</label>
                </div>

                <div style="display: flex; gap: 12px;">
                    <button type="button" id="close-modal-btn" style="flex: 1; padding: 15px; border-radius: 12px; background: transparent; border: 1px solid var(--glass-border); color: white; cursor: pointer; font-weight: 700;">Cancel</button>
                    <button type="submit" id="submit-upload-btn" class="btn-upload" style="flex: 2; justify-content: center;">Confirm Upload</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <div class="confirm-icon">
                <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h2 id="confirm-title" style="color: white; font-size: 20px; margin-bottom: 10px;">Are you sure?</h2>
            <p id="confirm-msg" style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">This action cannot be undone.</p>
            <div style="display: flex; gap: 12px;">
                <button id="confirm-cancel-btn" style="flex: 1; padding: 12px; border-radius: 10px; background: transparent; border: 1px solid var(--glass-border); color: white; cursor: pointer; font-weight: 700;">Cancel</button>
                <button id="confirm-ok-btn" style="flex: 1; padding: 12px; border-radius: 10px; background: var(--btn-red); border: none; color: white; cursor: pointer; font-weight: 700;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>


    <script src="/env.js"></script>
    <script src="/apps/file-hub/filehub_gdrive.js"></script>
</body>
</html>
