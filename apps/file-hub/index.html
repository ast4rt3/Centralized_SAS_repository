<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Hub | SAS Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --primary-light: #f0f7ff;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --green-500: #22c55e;
            --green-600: #16a34a;
            --amber-500: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            background-color: var(--slate-50);
            overflow: hidden;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Top Header */
        header {
            background: white;
            padding: 20px 40px 20px 80px;
            border-bottom: 1px solid var(--slate-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-left h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .header-left p {
            color: var(--slate-500);
            font-size: 12px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Status Indicator in Header */
        .status-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            cursor: pointer;
            transition: all 0.2s;
        }

        .status-pill:hover { border-color: var(--primary); }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .connected .status-dot { background-color: var(--green-500); }
        .disconnected .status-dot { background-color: var(--amber-500); }
        .connected { color: var(--green-600); background: #f0fdf4; border-color: #dcfce7; }

        /* Horizontal Filter Bar */
        .filter-bar {
            background: white;
            padding: 0 40px;
            border-bottom: 1px solid var(--slate-200);
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .filter-tab {
            padding: 16px 4px;
            font-size: 13px;
            font-weight: 700;
            color: var(--slate-500);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        .filter-tab:hover { color: var(--primary); }
        .filter-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }

        /* Main Content Grid */
        .content-area {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .file-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--slate-200);
            transition: all 0.2s;
        }

        .file-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .file-icon-box {
            height: 100px;
            background: var(--slate-50);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
        }

        .category-tag {
            position: absolute; top: 6px; right: 6px;
            background: var(--primary); color: white;
            font-size: 9px; font-weight: 900;
            padding: 2px 6px; border-radius: 10px;
        }

        .file-info h3 { font-size: 13px; font-weight: 700; color: var(--slate-800); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-info p { font-size: 10px; color: var(--slate-400); margin-bottom: 12px; }

        .file-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--slate-100); }
        .privacy-tag { font-size: 9px; font-weight: 800; display: flex; align-items: center; gap: 3px; }
        .privacy-tag.public { color: var(--green-600); }
        .privacy-tag.private { color: var(--slate-400); }

        .btn-icon { padding: 6px; background: var(--slate-50); border-radius: 6px; color: var(--slate-500); transition: all 0.2s; }
        .btn-icon:hover { background: var(--primary); color: white; }

        /* Empty State */
        .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--slate-300); text-align: center; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: white; width: 90%; max-width: 380px; border-radius: 20px; padding: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--slate-700); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--slate-200); background: var(--slate-50); font-size: 13px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--primary-light); border-radius: 12px; margin-bottom: 20px; }
        .checkbox-group input { width: 18px; height: 18px; }
        .checkbox-group label { font-size: 13px; font-weight: 700; color: var(--primary); }

        .modal-actions { display: flex; gap: 10px; }
        .btn-secondary { flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; color: var(--slate-500); cursor: pointer; border: none; background: none; }
    </style>
</head>
<body>
    <div class="layout">
        <header>
            <div class="header-left">
                <h2>File Hub</h2>
                <p>Personal storage for SAS members.</p>
            </div>
            <div class="header-right">
                <button id="open-upload-btn" class="btn-primary">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2.5" stroke-linecap="round"/></svg>
                    New Upload
                </button>
            </div>
        </header>

        <div class="filter-bar">
            <button class="filter-tab active" onclick="setFilter('all')">All Files</button>
            <button class="filter-tab" onclick="setFilter('Personal')">Personal</button>
            <button class="filter-tab" onclick="setFilter('Official')">Official Documents</button>
        </div>

        <div class="content-area" id="file-container">
            <div class="empty-state">
                <svg width="60" height="60" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom: 12px;"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" stroke-width="1"/></svg>
                <p style="font-size: 16px; font-weight: 600; color: var(--slate-400);">No files found</p>
                <p style="font-size: 13px;">Start uploading documents to your hub.</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <h2 style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 4px;">Upload Document</h2>
            <p style="font-size: 12px; color: var(--slate-500); margin-bottom: 20px;">Stored in your Centralized 2TB Drive.</p>
            
            <form id="upload-form">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-control">
                        <option value="Personal">Personal</option>
                        <option value="Official">Official Document</option>
                        <option value="Memo">Memo</option>
                        <option value="Form">Form</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Select File</label>
                    <input type="file" name="file" required class="form-control">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" name="isPublic" id="isPublic">
                    <label for="isPublic">Make Public</label>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="close-modal-btn">Cancel</button>
                    <button type="submit" class="btn-primary" id="submit-upload-btn" style="flex: 1;">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/env.js"></script>
    <script src="/apps/file-hub/filehub_gdrive.js"></script>
</body>
</html>
