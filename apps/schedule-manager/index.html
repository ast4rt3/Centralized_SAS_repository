<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Schedule Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --nbsc-blue: #004a99;
            --nbsc-dark: #0f172a;
            --nbsc-mid: #1e293b;
            --nbsc-gold: #f0ad4e;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --font-sans: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--nbsc-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            padding: 24px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: auto; }
        .header-text h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            font-family: var(--font-sans);
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--nbsc-gold); color: #000; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--nbsc-mid);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--nbsc-blue);
        }

        .card.active::before { background: #22c55e; }

        .card-header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
        .card-label { font-size: 1.1rem; font-weight: 800; color: var(--nbsc-gold); }
        .card-date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }

        .card-time { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
        .card-time i { color: var(--nbsc-blue); }

        .card-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 16px; border-top: 1px solid var(--border);
        }

        .status-pill {
            padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; background: rgba(255,255,255,0.1);
        }
        .status-pill.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }

        .modal {
            background: var(--nbsc-mid);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow);
        }

        form.modal-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .form-group input {
            padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.2); color: white; font-family: var(--font-sans);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .hidden { display: none !important; }

        #loadingOverlay {
            position: fixed; inset: 0; background: var(--nbsc-dark);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--nbsc-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .header { padding: 16px; }
            .container { padding: 16px; }
            .actions-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Initializing Supabase...</p>
    </div>

    <header class="header">
        <div class="header-brand">
            <img src="https://nbsc.edu.ph/wp-content/uploads/2024/03/cropped-NBSC_NewLogo_icon.png" class="header-logo" alt="NBSC Logo">
            <div class="header-text">
                <h1>Schedule Manager</h1>
            </div>
        </div>
        <button class="btn btn-primary" onclick="openModal()">
            <i class='bx bx-plus'></i> New Window
        </button>
    </header>

    <div class="container">
        <div class="actions-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn btn-outline" onclick="loadSchedules()">
                    <i class='bx bx-refresh'></i> Refresh
                </button>
                <p id="statsText" style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;"></p>
            </div>
        </div>

        <div id="scheduleGrid" class="schedule-grid">
            <!-- Cards injected here -->
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 24px; font-weight: 800;">Create Scanning Window</h2>
            <form id="scheduleForm" class="modal-form">
                <div class="form-group">
                    <label>Label / Title</label>
                    <input type="text" id="schedLabel" placeholder="e.g. Morning Parade" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="schedDate" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Schedule</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../env.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
