<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Schedule Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --nbsc-blue: #004a99;
            --nbsc-dark: #0f172a;
            --nbsc-mid: #1e293b;
            --nbsc-gold: #f0ad4e;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --font-sans: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--nbsc-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .header { padding: 24px; background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: auto; }
        .header-text h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; gap: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 800; font-family: var(--font-sans); text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: var(--nbsc-gold); color: #000; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--nbsc-mid); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--nbsc-blue); }
        .card.active::before { background: #22c55e; }
        .card-header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
        .card-label { font-size: 1.1rem; font-weight: 800; color: var(--nbsc-gold); }
        .card-date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .card-time { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
        .card-time i { color: var(--nbsc-blue); }
        .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; background: rgba(255,255,255,0.1); }
        .status-pill.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--nbsc-mid); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 90%; max-width: 500px; box-shadow: var(--shadow); }
        form.modal-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .form-group input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; font-family: var(--font-sans); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .hidden { display: none !important; }
        #loadingOverlay { position: fixed; inset: 0; background: var(--nbsc-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--nbsc-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .header { padding: 16px; } .container { padding: 16px; } .actions-bar { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Initializing Supabase...</p>
    </div>

    <header class="header">
        <div class="header-brand">
            <img src="https://nbsc.edu.ph/wp-content/uploads/2024/03/cropped-NBSC_NewLogo_icon.png" class="header-logo" alt="NBSC Logo">
            <div class="header-text"><h1>Schedule Manager</h1></div>
        </div>
        <button class="btn btn-primary" onclick="openModal()"><i class='bx bx-plus'></i> New Window</button>
    </header>

    <div class="container">
        <div class="actions-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn btn-outline" onclick="loadSchedules()"><i class='bx bx-refresh'></i> Refresh</button>
                <p id="statsText" style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;"></p>
            </div>
        </div>

        <div id="scheduleGrid" class="schedule-grid"></div>
    </div>

    <!-- Modal -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 24px; font-weight: 800;">Create Scanning Window</h2>
            <form id="scheduleForm" class="modal-form">
                <div class="form-group">
                    <label>Label / Title</label>
                    <input type="text" id="schedLabel" placeholder="e.g. Morning Parade" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="schedDate" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Schedule</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="../../env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Inline diagnostics (remove in prod) -->
    <script>
        (function() {
            console.log('🔍 DIAGNOSTIC: Inline preload check starting...');
            if (!window.ENV) { console.error('❌ env.js missing'); }
            else { console.log('✅ env.js loaded', { url: window.ENV.SUPABASE_URL?.substring(0,30)+'...', keyPresent: !!window.ENV.SUPABASE_ANON_KEY }); }
            if (!window.supabase) { console.error('❌ Supabase library not loaded'); }
            else { console.log('✅ Supabase library present'); }
            window.addEventListener('load', () => setTimeout(async () => {
                if (window.supabase && window.ENV) {
                    try {
                        const client = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
                        const { data, error } = await client.from('sas_schedules').select('count').limit(1);
                        if (error) console.error('❌ DB test failed:', error);
                        else console.log('✅ DB reachable, schedule count =', data);
                    } catch(e) { console.error('❌ DB test exception:', e); }
                }
                console.log('🔍 POST-LOAD CHECK:', { initExists: typeof init, clientExists: typeof supabaseClient, loadingDisplay: getComputedStyle(document.getElementById('loadingOverlay')).display });
            }, 1000));
        })();
    </script>

    <!-- INLINED app.js to avoid path/caching issues -->
    <script>
        // ========== BEGIN apps/schedule-manager/app.js ==========
        let supabaseClient;
        const els = {
            grid: document.getElementById('scheduleGrid'),
            form: document.getElementById('scheduleForm'),
            modal: document.getElementById('modalOverlay'),
            loading: document.getElementById('loadingOverlay'),
            stats: document.getElementById('statsText')
        };

        async function init() {
            console.log("🚀 Initializing Schedule Manager...");
            
            if (!window.ENV?.SUPABASE_URL || !window.ENV?.SUPABASE_ANON_KEY) {
                console.error("❌ Missing Supabase credentials");
                showError("Supabase credentials missing in env.js");
                return;
            }
            
            if (!window.supabase) {
                console.error("❌ Supabase library not loaded");
                showError("Supabase library not loaded — check internet connection");
                return;
            }
            
            try {
                supabaseClient = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
                console.log("✅ Supabase client ready");
            } catch (e) {
                console.error("❌ Client creation failed:", e);
                showError("Failed to create Supabase client:\n" + e.message);
                return;
            }
            
            document.getElementById('schedDate').valueAsDate = new Date();
            els.form.addEventListener('submit', handleFormSubmit);
            
            try {
                await loadSchedules();
                console.log("✅ Schedules loaded");
            } catch (e) {
                console.error("❌ loadSchedules failed:", e);
            }
            
            els.loading.classList.add('hidden');
            console.log("✅ Init complete");
        }

        function showError(msg) {
            alert(msg);
            els.loading.classList.add('hidden');
        }

        async function loadSchedules() {
            console.log("📡 Fetching schedules...");
            const { data, error, status, statusText } = await supabaseClient
                .from('sas_schedules')
                .select('*')
                .order('created_at', { ascending: false });

            console.log('📊 Query raw response:', { 
                rowCount: data?.length, 
                error: error?.message, 
                status, 
                statusText,
                firstRow: data?.[0] 
            });

            if (error) {
                console.error("❌ Supabase Error:", error);
                let msg = "Failed to load schedules.\n";
                if (error.code === '42P01') {
                    msg += "Table 'sas_schedules' not found.\n\nDid you run the SQL migration?";
                } else if (error.code === '42501') {
                    msg += "Permission denied — RLS may be enabled.\n\nRun: ALTER TABLE sas_schedules DISABLE ROW LEVEL SECURITY;";
                } else {
                    msg += "(" + (error.code || 'unknown') + ") " + error.message;
                }
                showError(msg);
                els.grid.innerHTML = `<div style="text-align:center;padding:40px;color:red;">${msg.replace(/\n/g, '<br>')}</div>`;
                return;
            }

            console.log('✅ Data received, rows:', data?.length);
            renderSchedules(data);
        }

        function renderSchedules(schedules) {
            els.grid.innerHTML = '';
            let activeCount = 0;

            if (!schedules || schedules.length === 0) {
                els.grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-muted);">
                        <i class='bx bx-calendar-x' style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;"></i>
                        <p>No schedules found. Create your first check-in window!</p>
                    </div>
                `;
                els.stats.textContent = "0 Windows defined";
                return;
            }

            schedules.forEach(sched => {
                const isActive = sched.is_active;
                if (isActive) activeCount++;

                const card = document.createElement('div');
                card.className = `card ${isActive ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <p class="card-date">${formatDate(sched.date)}</p>
                            <h3 class="card-label">${sched.label}</h3>
                        </div>
                        <div class="status-pill ${isActive ? 'active' : ''}">
                            ${isActive ? 'Active' : 'Archived'}
                        </div>
                    </div>
                    <div class="card-time">
                        <i class='bx bx-time-five'></i>
                        <span>${formatTime(sched.start_time)} - ${formatTime(sched.end_time)}</span>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline" onclick="toggleStatus('${sched.id}', ${isActive})" style="padding: 6px 12px; font-size: 0.7rem;">
                            <i class='bx ${isActive ? 'bx-archive-in' : 'bx-play'}'></i> 
                            ${isActive ? 'Deactivate' : 'Activate'}
                        </button>
                        <button class="btn btn-outline" onclick="deleteSchedule('${sched.id}')" style="padding: 6px 12px; font-size: 0.7rem; color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">
                            <i class='bx bx-trash'></i>
                        </button>
                    </div>
                `;
                els.grid.appendChild(card);
            });

            els.stats.textContent = `${activeCount} Active / ${schedules.length} Total Windows`;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const payload = {
                label: document.getElementById('schedLabel').value,
                date: document.getElementById('schedDate').value,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value,
                is_active: true
            };

            console.log("🚀 Saving schedule:", payload);
            const { error } = await supabaseClient
                .from('sas_schedules')
                .insert([payload]);

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                closeModal();
                loadSchedules();
            }
        }

        async function toggleStatus(id, currentStatus) {
            const { error } = await supabaseClient
                .from('sas_schedules')
                .update({ is_active: !currentStatus })
                .eq('id', id);

            if (error) alert("Error: " + error.message);
            else loadSchedules();
        }

        async function deleteSchedule(id) {
            if (!confirm("Are you sure you want to delete this window and ALL associated attendance logs?")) return;

            const { error } = await supabaseClient
                .from('sas_schedules')
                .delete()
                .eq('id', id);

            if (error) alert("Error: " + error.message);
            else loadSchedules();
        }

        function openModal() { els.modal.style.display = 'flex'; }
        function closeModal() { els.modal.style.display = 'none'; els.form.reset(); document.getElementById('schedDate').valueAsDate = new Date(); }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const h12 = hour % 12 || 12;
            return `${h12}:${m} ${ampm}`;
        }

        // Init on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        // ========== END apps/schedule-manager/app.js ==========
    </script>

    <script>
        // Global error handler
        window.addEventListener('error', (event) => {
            console.error('❌ GLOBAL ERROR:', event.error || event.message);
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.innerHTML = `<div style="color:#ef4444;text-align:center;max-width:600px;padding:20px;"><h2>❌ Startup Error</h2><p><strong>${event.message}</strong></p><p style="font-size:0.8rem;color:#94a3b8;margin-top:12px;">Check console (F12) for full stack trace.</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#004a99;color:white;border:none;border-radius:6px;cursor:pointer;">Retry</button></div>`;
            }
        });
    </script>
</body>
</html>
