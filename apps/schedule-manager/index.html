<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Scanner Schedule Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --nbsc-blue: #004a99;
            --nbsc-dark: #0f172a;
            --nbsc-mid: #1e293b;
            --nbsc-gold: #f0ad4e;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --font-sans: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--nbsc-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .header { padding: 24px 24px 24px 60px; background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 44px; height: auto; }
        .header-text h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 800; font-family: var(--font-sans); text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: var(--nbsc-gold); color: #000; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
        /* Events Container */
        .events-container { display: flex; flex-direction: column; gap: 24px; padding-bottom: 32px; }
        
        /* Event Card */
        .event-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; }
        .event-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.12); }
        .event-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; user-select: none; }
        .event-header-left { display: flex; align-items: center; gap: 16px; }
        .event-toggle { font-size: 1.5rem; color: var(--nbsc-gold); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .event-card.collapsed .event-toggle { transform: rotate(-90deg); }
        .event-title { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .event-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
        .event-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .event-badge { background: rgba(240, 173, 78, 0.15); color: var(--nbsc-gold); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(240, 173, 78, 0.2); }
        
        /* Schedule Windows Grid */
        .windows-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 24px; background: rgba(255,255,255,0.02); transition: all 0.3s ease; }
        .event-card.collapsed .windows-list { display: none; }
        
        .window-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: background 0.2s, border-color 0.2s; position: relative; overflow: hidden; }
        .window-item:hover { background: rgba(15, 23, 42, 0.9); border-color: rgba(255,255,255,0.15); }
        .window-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #4b5563; transition: background 0.3s; }
        .window-item.is-active::before { background: #10b981; }
        
        .window-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .window-name { font-weight: 700; color: #fff; font-size: 1rem; }
        
        .window-details { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .window-details p { display: flex; align-items: center; gap: 6px; }
        .window-details i { font-size: 1rem; color: var(--nbsc-gold); opacity: 0.8; }
        
        .window-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
        .status-pill.active { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-pill.inactive { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
        
        .btn-icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }
        .btn-icon i { font-size: 1.1rem; }
        .action-group { display: flex; gap: 8px; }
        
        /* New Window Button Card */
        .add-window-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            min-height: 140px;
        }
        .add-window-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--nbsc-gold);
            color: var(--nbsc-gold);
            transform: translateY(-2px);
        }
        .add-window-btn i { font-size: 2.2rem; }
        .add-window-btn span { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--nbsc-mid); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 90%; max-width: 500px; box-shadow: var(--shadow); }
        form.modal-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .form-group input, .form-group select { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; font-family: var(--font-sans); }
        .form-group select { cursor: pointer; outline: none; }
        .form-group select option { background: var(--nbsc-mid); color: white; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .hidden { display: none !important; }
        #loadingOverlay { position: fixed; inset: 0; background: var(--nbsc-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--nbsc-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .header { padding: 16px; } .container { padding: 16px; } .actions-bar { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Initializing Supabase...</p>
    </div>

    <header class="header">
        <div class="header-brand">
            <img src="../../assets/sas_logo_real.png" class="header-logo" alt="NBSC Logo">
            <div class="header-text"><h1>Scanner Schedule Manager</h1></div>
        </div>
    </header>

    <div class="container">
        <div class="actions-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn btn-outline" onclick="loadSchedules()"><i class='bx bx-refresh'></i> Refresh</button>
                <p id="statsText" style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;"></p>
            </div>
            <button class="btn btn-primary" onclick="openEventModal()"><i class='bx bx-folder'></i> New Event</button>
        </div>

        <div id="eventsContainer" class="events-container">
            <!-- Event cards will be dynamically inserted here -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i class='bx bx-calendar-x'></i>
            <p>No schedules found. Create your first check-in window!</p>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="eventModalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 24px; font-weight: 800;">Create Event</h2>
            <form id="eventForm" class="modal-form">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="eventName" placeholder="e.g. Foundation Day" required>
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <input type="text" id="eventDesc" placeholder="Brief description...">
                </div>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Event</button>
                    <button type="button" class="btn btn-outline" onclick="closeEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Window Modal -->
    <div id="windowModalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 id="windowModalTitle" style="margin-bottom: 24px; font-weight: 800;">Create Scanning Window</h2>
            <form id="windowForm" class="modal-form">
                <input type="hidden" id="windowId">
                <div class="form-group">
                    <label>Window Name</label>
                    <input type="text" id="windowLabel" placeholder="e.g. Morning Parade" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="windowDate" required onchange="loadEventsForDate()">
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: baseline;">
                        <label>Target Event</label>
                        <span style="font-size: 0.7rem; color: var(--nbsc-gold); text-transform: uppercase; font-weight: 800; opacity: 0.8;">Or Create New</span>
                    </div>
                    <select id="windowEventSelect" required>
                        <option value="">Loading events...</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Window</button>
                    <button type="button" class="btn btn-outline" onclick="closeWindowModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModalOverlay" class="modal-overlay">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <div style="font-size: 3.5rem; color: #ef4444; margin-bottom: 12px;"><i class='bx bx-error-circle'></i></div>
            <h2 id="confirmTitle" style="margin-bottom: 16px; font-weight: 800;">Are you sure?</h2>
            <p id="confirmMessage" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;"></p>
            <div style="display: flex; gap: 12px;">
                <button type="button" class="btn btn-outline" id="confirmCancelBtn" style="flex: 1;">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmOkBtn" style="flex: 1;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script type="module" src="../../src/utils/app-bridge.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        let supabaseClient;
        let allEventsCache = [];
        let allSchedulesCache = [];
        const els = {
            container: document.getElementById('eventsContainer'),
            emptyState: document.getElementById('emptyState'),
            eventForm: document.getElementById('eventForm'),
            windowForm: document.getElementById('windowForm'),
            eventModal: document.getElementById('eventModalOverlay'),
            windowModal: document.getElementById('windowModalOverlay'),
            confirmModal: document.getElementById('confirmModalOverlay'),
            confirmTitle: document.getElementById('confirmTitle'),
            confirmMessage: document.getElementById('confirmMessage'),
            confirmOkBtn: document.getElementById('confirmOkBtn'),
            confirmCancelBtn: document.getElementById('confirmCancelBtn'),
            windowId: document.getElementById('windowId'),
            windowLabel: document.getElementById('windowLabel'),
            windowDate: document.getElementById('windowDate'),
            startTime: document.getElementById('startTime'),
            endTime: document.getElementById('endTime'),
            windowEventSelect: document.getElementById('windowEventSelect'),
            windowModalTitle: document.getElementById('windowModalTitle'),
            loading: document.getElementById('loadingOverlay'),
            stats: document.getElementById('statsText')
        };

        // Helper to wait for window.ENV to be populated by app-bridge
        async function waitForEnv(timeout = 5000) {
            if (window.ENV) return window.ENV;
            return new Promise((resolve) => {
                const start = Date.now();
                const interval = setInterval(() => {
                    if (window.ENV || (Date.now() - start) > timeout) {
                        clearInterval(interval);
                        resolve(window.ENV);
                    }
                }, 100);
            });
        }

        async function init() {
            const env = await waitForEnv();
            if (!env?.SUPABASE_URL || !env?.SUPABASE_ANON_KEY) {
                alert("Missing Supabase credentials. Ensure env.js is configured correctly.");
                return;
            }
            supabaseClient = window.supabase.createClient(env.SUPABASE_URL, env.SUPABASE_ANON_KEY);
            els.eventForm.addEventListener('submit', handleEventFormSubmit);
            els.windowForm.addEventListener('submit', handleWindowFormSubmit);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeEventModal();
                    closeWindowModal();
                    els.confirmModal.style.display = 'none';
                }
            });

            await loadSchedules();
            els.loading.classList.add('hidden');
        }

        async function loadSchedules() {
            try {
                const { data: events } = await supabaseClient.from('sas_events').select('*').order('event_date', { ascending: false });
                allEventsCache = events || [];
                const eventsMap = allEventsCache.reduce((acc, e) => { acc[e.id] = e; return acc; }, {});

                const { data: schedules } = await supabaseClient.from('sas_schedules').select('*').order('date', { ascending: false }).order('start_time', { ascending: false });
                allSchedulesCache = schedules || [];
                
                const merged = (schedules || []).map(s => ({
                    ...s,
                    sas_events: s.event_id ? eventsMap[s.event_id] : null
                }));

                renderSchedules(merged, allEventsCache);
            } catch (err) {
                console.error("Load failed:", err);
            }
        }

        function renderSchedules(schedules, events = []) {
            els.container.innerHTML = '';
            els.stats.textContent = '';
            
            if (events.length === 0 && (!schedules || schedules.length === 0)) {
                els.container.style.display = 'none';
                els.emptyState.style.display = 'block';
                return;
            }
            
            els.container.style.display = 'flex';
            els.emptyState.style.display = 'none';
            
            const eventRows = {};
            events.forEach(evt => {
                eventRows[evt.id] = { event: evt, schedules: [], collapsed: false };
            });

            schedules.forEach(s => {
                const key = s.event_id || 'no-event';
                if (!eventRows[key]) {
                    eventRows[key] = { event: s.sas_events || { name: 'No Event', event_date: s.date }, schedules: [], collapsed: false };
                }
                eventRows[key].schedules.push(s);
            });
            
            Object.values(eventRows)
                .sort((a, b) => new Date(b.event.event_date || 0) - new Date(a.event.event_date || 0))
                .forEach(group => {
                const event = group.event;
                const hasActiveWindow = group.schedules.some(s => s.is_active);
                const card = document.createElement('div');
                card.className = hasActiveWindow ? 'event-card' : 'event-card collapsed';
                card.innerHTML = `
                    <div class="event-header" onclick="toggleEvent(this)">
                        <div class="event-header-left">
                            <i class='bx bxs-chevron-down event-toggle'></i>
                            <div>
                                <h3 class="event-title">${escapeHtml(event.name || 'No Event')}</h3>
                                <div class="event-meta">
                                    <span class="event-badge"><i class='bx bx-windows'></i> ${group.schedules.length} Windows</span>
                                </div>
                            </div>
                        </div>
                        <div class="action-group">
                            <button class="btn btn-outline btn-icon" onclick="event.stopPropagation(); deleteEvent('${event.id}', '${escapeHtml(event.name).replace(/'/g, "\\'")}')" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">
                                <i class='bx bx-trash'></i>
                            </button>
                        </div>
                    </div>
                    <div class="windows-list">
                        ${group.schedules.map(sched => `
                            <div class="window-item ${sched.is_active ? 'is-active' : ''}">
                                <div class="window-header">
                                    <div class="window-name">${escapeHtml(sched.label)}</div>
                                    <span class="status-pill ${sched.is_active ? 'active' : 'inactive'}">${sched.is_active ? 'Active' : 'Archived'}</span>
                                </div>
                                <div class="window-details">
                                    <p><i class='bx bx-time-five'></i> ${formatTime(sched.start_time)} – ${formatTime(sched.end_time)}</p>
                                </div>
                                <div class="window-actions">
                                    <button class="btn btn-outline" onclick="toggleStatus('${sched.id}', ${sched.is_active})">
                                        ${sched.is_active ? 'Deactivate' : 'Activate'}
                                    </button>
                                    <div style="display: flex; gap: 8px;">
                                        <button class="btn btn-outline btn-icon" onclick="editSchedule('${sched.id}')" style="color: var(--nbsc-gold); border-color: rgba(240, 173, 78, 0.2);">
                                            <i class='bx bx-edit'></i>
                                        </button>
                                        <button class="btn btn-outline btn-icon" onclick="deleteSchedule('${sched.id}')" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">
                                            <i class='bx bx-trash'></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                        <div class="add-window-btn" onclick="openWindowModal('${event.id}', '${event.event_date}')">
                            <i class='bx bx-plus-circle'></i>
                            <span>New Window</span>
                        </div>
                    </div>
                `;
                els.container.appendChild(card);
            });
            els.stats.textContent = `${events.length} Events`;
        }

        function toggleEvent(el) {
            el.parentElement.classList.toggle('collapsed');
        }

        async function handleWindowFormSubmit(e) {
            e.preventDefault();
            const id = els.windowId.value;
            const label = els.windowLabel.value;
            const date = els.windowDate.value;
            const start_time = els.startTime.value;
            const end_time = els.endTime.value;
            const event_id = els.windowEventSelect.value;

            try {
                let target_event_id = event_id;
                if (event_id === '__new__' || !event_id) {
                    const { data: newEvt, error: evErr } = await supabaseClient.from('sas_events').insert([{
                        name: 'Event on ' + date,
                        event_date: date,
                        created_by: 'system'
                    }]).select('id').single();
                    if (evErr) throw evErr;
                    target_event_id = newEvt.id;
                }

                let error;
                if (id) {
                    const res = await supabaseClient.from('sas_schedules').update({
                        label, date, start_time, end_time, event_id: target_event_id
                    }).eq('id', id);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('sas_schedules').insert([{
                        label, date, start_time, end_time, is_active: true, event_id: target_event_id
                    }]);
                    error = res.error;
                }

                if (error) throw error;
                closeWindowModal();
                loadSchedules();
            } catch (err) {
                alert("Save failed: " + err.message);
            }
        }

        async function handleEventFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('eventName').value;
            const event_date = new Date().toISOString().split('T')[0]; // Default to today to avoid DB constraint issues
            const description = document.getElementById('eventDesc').value;

            try {
                const { error } = await supabaseClient.from('sas_events').insert([{ name, event_date, description, created_by: 'system' }]);
                if (error) throw error;
                closeEventModal();
                loadSchedules();
            } catch (err) {
                alert("Save failed: " + err.message);
            }
        }

        async function toggleStatus(id, current) {
            await supabaseClient.from('sas_schedules').update({ is_active: !current }).eq('id', id);
            loadSchedules();
        }

        async function deleteSchedule(id) {
            if (confirm("Delete this window?")) {
                await supabaseClient.from('sas_schedules').delete().eq('id', id);
                loadSchedules();
            }
        }

        async function deleteEvent(id, name) {
            if (confirm(`Delete event "${name}" and all its windows?`)) {
                await supabaseClient.from('sas_events').delete().eq('id', id);
                loadSchedules();
            }
        }

        function openEventModal() { els.eventModal.style.display = 'flex'; }
        function closeEventModal() { els.eventModal.style.display = 'none'; els.eventForm.reset(); }
        
        async function openWindowModal(eventId = null, eventDate = null) {
            els.windowId.value = '';
            els.windowModalTitle.innerText = 'Create Scanning Window';
            if (eventDate) els.windowDate.value = eventDate;
            else els.windowDate.value = new Date().toISOString().split('T')[0];
            
            els.windowModal.style.display = 'flex';
            await loadEventsForDate();
            if (eventId) els.windowEventSelect.value = eventId;
        }

        function closeWindowModal() { els.windowModal.style.display = 'none'; els.windowForm.reset(); }

        async function editSchedule(id) {
            const sched = allSchedulesCache.find(s => s.id === id);
            if (!sched) return;
            
            els.windowId.value = sched.id;
            els.windowLabel.value = sched.label;
            els.windowDate.value = sched.date;
            els.startTime.value = sched.start_time;
            els.endTime.value = sched.end_time;
            els.windowModalTitle.innerText = 'Edit Scanning Window';
            
            els.windowModal.style.display = 'flex';
            await loadEventsForDate();
            els.windowEventSelect.value = sched.event_id || '';
        }

        async function loadEventsForDate() {
            const date = els.windowDate.value;
            let options = '<option value="" disabled selected>-- Select Event --</option>';
            if (allEventsCache.length === 0) {
                options = `<option value="__new__" selected>✦ Create new event</option>`;
            } else {
                allEventsCache.forEach(e => options += `<option value="${e.id}">${escapeHtml(e.name)}</option>`);
                options += `<option value="__new__">✦ Create new event</option>`;
            }
            els.windowEventSelect.innerHTML = options;
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const h12 = hour % 12 || 12;
            return `${h12}:${m} ${ampm}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
