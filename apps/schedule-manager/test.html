<!DOCTYPE html>
<html><head><title>SM Test</title>  <script src="../../src/core/global-presence.js"></script>
</head><body>
<h1>Schedule Manager — Minimal Test</h1>
<div id="status"></div>
<script src="../../env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const s = document.getElementById('status');
    const log = (msg, emoji='') => { s.innerHTML += '<p>' + emoji + ' ' + msg + '</p>'; console.log(emoji, msg); };
    
    log('1. Checking env...', '🔍');
    if (!window.ENV?.SUPABASE_URL) { log('MISSING ENV', '❌'); throw 'ENV missing'; }
    log('   URL: ' + window.ENV.SUPABASE_URL.substring(0,40) + '...', '✅');
    
    log('2. Checking Supabase library...', '🔍');
    if (!window.supabase) { log('LIBRARY NOT LOADED', '❌'); throw 'supabase missing'; }
    log('   Library loaded', '✅');
    
    log('3. Creating client...', '🔍');
    const client = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
    log('   Client created', '✅');
    
    log('4. Querying sas_schedules...', '🔍');
    client.from('sas_schedules').select('count').limit(1).then(({data, error}) => {
        if (error) {
            log('❌ Query error: ' + error.code + ' — ' + error.message, '❌');
            if (error.code === '42P01') {
                log('➡️  Table does not exist. Run the SQL migration first!', '⚠️');
            }
        } else {
            log('✅ Success! Count = ' + JSON.stringify(data), '✅');
        }
    }).catch(e => {
        log('❌ Promise rejected: ' + e.message, '❌');
    });
</script>
</body></html>
