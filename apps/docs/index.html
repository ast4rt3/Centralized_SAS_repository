<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Documents Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <!-- Google Identity Services (GIS) client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="../../src/utils/app-bridge.js"></script>
    <style>
        :root {
            --primary: #003366;
            --accent: #FFD700;
            --bg-deep: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;

            /* Vibrant Button Palette from Home Screen */
            --btn-red: #dc2626;
            --btn-purple: #7c3aed;
            --btn-teal: #0d9488;
            --btn-gold: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a 0%, #0f172a 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Styling */
        .app-header {
            padding: 30px 40px;
            padding-left: 90px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-brand h1 span {
            color: var(--accent);
        }

        .header-brand p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Connection & Upload Controls */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Status Pill */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 12px;
        }

        .status-pill {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            transition: all 0.3s;
        }

        .status-pill.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .btn-connect {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-connect:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: white;
        }

        .btn-upload {
            background: var(--btn-gold);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
            filter: brightness(1.1);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Category Filter Bar */
        .filter-bar {
            padding: 25px 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .filter-pill[data-cat="all"].active {
            background: var(--btn-gold);
            color: #0f172a;
            border-color: var(--btn-gold);
        }

        .filter-pill[data-cat="Personal"].active {
            background: var(--btn-purple);
            border-color: var(--btn-purple);
        }

        .filter-pill[data-cat="Official Documents"].active {
            background: var(--btn-teal);
            border-color: var(--btn-teal);
        }

        /* Content Area Flex Layout */
        .content-area {
            display: flex;
            gap: 40px;
            padding: 20px 40px 60px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 200px);
        }

        .docs-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            align-items: start;
            align-content: start;
            transition: all 0.3s;
            overflow-y: auto;
            padding-right: 10px;
        }

        .docs-grid::-webkit-scrollbar {
            width: 6px;
        }

        .docs-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Side Details Panel */
        .details-panel {
            width: 380px;
            background: rgba(30, 41, 59, 0.3);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            position: sticky;
            top: 0;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .details-header {
            text-align: left;
            margin-bottom: 30px;
        }

        .details-preview-box {
            width: 100%;
            height: 200px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .details-preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .details-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-side-action {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-side-action:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
        }

        .details-section-title {
            font-size: 13px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .details-label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .details-value {
            color: white;
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        /* Grid Scales */
        .docs-grid.small-grid {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .docs-grid.medium-grid {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .docs-grid.large-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .docs-grid.xl-grid {
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 28px;
        }

        /* Small Grid Adjustments */
        .docs-grid.small-grid .doc-card {
            padding: 15px;
            border-radius: 16px;
        }

        .docs-grid.small-grid .doc-icon-box {
            height: 70px;
            margin-bottom: 10px;
        }

        .docs-grid.small-grid .doc-info h3 {
            font-size: 12px;
        }

        .docs-grid.small-grid .doc-footer {
            padding-top: 10px;
        }

        .docs-grid.small-grid .btn-action {
            width: 28px;
            height: 28px;
        }

        /* Medium Adjustments */
        .docs-grid.medium-grid .doc-icon-box {
            height: 90px;
            margin-bottom: 14px;
        }

        /* Large Adjustments */
        .docs-grid.large-grid .doc-icon-box {
            height: 100px;
            margin-bottom: 16px;
        }

        /* XL Adjustments */
        .docs-grid.xl-grid .doc-icon-box {
            height: 110px;
            margin-bottom: 18px;
        }

        /* List View Layout Overhaul */
        .docs-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .docs-grid.list-view .doc-card {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            border-radius: 12px;
            gap: 15px;
        }

        .docs-grid.list-view .doc-icon-box {
            width: 40px;
            height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .docs-grid.list-view .doc-icon-box svg {
            width: 20px;
            height: 20px;
        }

        .docs-grid.list-view .category-tag {
            display: none;
        }

        .docs-grid.list-view .doc-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .docs-grid.list-view .doc-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin: 0;
            flex: 1;
        }

        .docs-grid.list-view .doc-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
            width: 120px;
        }

        .docs-grid.list-view .doc-footer {
            margin: 0;
            padding: 0;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .docs-grid.list-view .privacy-tag {
            padding: 4px 10px;
            font-size: 10px;
            margin: 0;
        }

        .docs-grid.list-view .doc-actions {
            margin: 0;
            gap: 8px;
        }

        /* View Menu Dropdown Styles */
        .view-menu {
            position: relative;
        }

        .view-menu-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .view-menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .view-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px;
            min-width: 180px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 200;
        }

        .view-menu-dropdown.show {
            display: block;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-option {
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .view-option:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .view-option.active {
            color: var(--accent);
            background: rgba(255, 215, 0, 0.05);
        }

        /* Glass Card Overhaul */
        .doc-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .doc-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .doc-card.selected {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        .doc-icon-box {
            height: 120px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--accent);
            position: relative;
        }

        .category-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }

        .doc-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-info p {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .doc-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid var(--glass-border);
        }

        .privacy-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .privacy-tag.public {
            background: rgba(13, 148, 136, 0.15);
            color: #2dd4bf;
        }

        .privacy-tag.private {
            background: rgba(220, 38, 38, 0.15);
            color: #f87171;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .doc-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-action:hover {
            background: var(--accent);
            color: #0f172a;
            transform: translateY(-3px);
        }

        .btn-action.delete:hover {
            background: var(--btn-red);
            color: white;
            border-color: var(--btn-red);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 450px;
            border-radius: 28px;
            padding: 40px;
        }

        .input-style {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 14px;
            color: white;
            margin-top: 8px;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 16px 24px;
            border-radius: 16px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(120%);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--btn-teal);
        }

        .toast.error {
            border-left: 4px solid var(--btn-red);
        }

        /* Preview Modal Styles */
        #preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(25px);
            z-index: 2000;
            flex-direction: column;
        }

        .preview-header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.6);
        }

        .preview-content {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .preview-frame {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: white;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
        }

        .btn-close-preview {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-close-preview:hover {
            background: var(--btn-red);
            border-color: var(--btn-red);
        }

        /* Custom Confirm Modal */
        #confirm-modal .modal {
            max-width: 400px;
            text-align: center;
        }

        .confirm-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>SAS <span>Documents Vault</span></h1>
            <p>Google Drive & Supabase Centralized Metadata Repository</p>
        </div>

        <div class="header-controls">
            <!-- Google Drive Connection Status -->
            <div class="connection-status">
                <span class="status-pill connected" id="status-pill"></span>
                <span class="status-label" id="status-text">Connected</span>
            </div>

            <!-- View Menu -->
            <div class="view-menu" id="view-menu">
                <button class="view-menu-btn" id="view-menu-btn">
                    <span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </span>
                    <span id="current-view-label">Medium</span>
                    <span style="font-size: 0.6rem; margin-top: 2px;">▼</span>
                </button>
                <div class="view-menu-dropdown" id="view-menu-dropdown">
                    <button class="view-option" data-view="xl">Extra large icons</button>
                    <button class="view-option" data-view="large">Large icons</button>
                    <button class="view-option active" data-view="medium">Medium icons</button>
                    <button class="view-option" data-view="small">Small icons</button>
                    <div style="height: 1px; background: var(--glass-border); margin: 4px 8px;"></div>
                    <button class="view-option" data-view="list">List View</button>
                </div>
            </div>

            <!-- Upload File Trigger -->
            <button class="btn-upload" id="open-upload-btn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Upload Document
            </button>
        </div>
    </header>

    <div class="filter-bar">
        <div class="filter-pill active" data-cat="all">All Library</div>
        <div class="filter-pill" data-cat="Personal">Personal Storage</div>
        <div class="filter-pill" data-cat="Official Documents">Official Vault</div>
    </div>

    <main class="content-area">
        <div id="docs-grid" class="docs-grid">
            <div style="text-align: center; padding-top: 100px; color: var(--text-muted); width: 100%;">
                <p>Waiting for Google Drive Authorization...</p>
            </div>
        </div>

        <!-- Side Details Panel -->
        <aside id="details-panel" class="details-panel">
            <div class="details-header">
                <div id="details-preview-container" class="details-preview-box"></div>
                <h2 id="details-title" class="details-title">Document Name</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                    <button class="btn-side-action" id="details-open-btn" style="flex: 1;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        Open File
                    </button>
                    <button class="btn-side-action" id="details-visibility-btn" style="flex: 1;">
                        <!-- Icon and Text loaded dynamically -->
                    </button>
                </div>
            </div>

            <div class="details-section-title">Properties</div>
            <div class="details-table" id="details-table"></div>

            <button class="btn-side-action" style="margin-top: 30px;"
                onclick="if(window.docsState?.currentSelectedFile) docsEditDescription(window.docsState.currentSelectedFile.id)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                Edit Description
            </button>
        </aside>
    </main>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal">
        <div class="modal">
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 20px; color: var(--accent);">Upload Document</h2>
            <form id="upload-form">
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Select Category</label>
                    <select name="category" class="input-style" required>
                        <option value="Personal">Personal Storage</option>
                        <option value="Official Documents">Official Vault</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Choose Document</label>
                    <input type="file" name="file" class="input-style" required>
                </div>

                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px;">
                    <input type="checkbox" name="isPublic" id="isPublic" style="width:20px; height:20px; accent-color: var(--accent);">
                    <label for="isPublic" style="font-weight: 600; cursor: pointer;">Public Access (Show on Landing Page)</label>
                </div>

                <div style="display: flex; gap: 12px;">
                    <button type="button" id="close-modal-btn" style="flex: 1; padding: 15px; border-radius: 12px; background: transparent; border: 1px solid var(--glass-border); color: white; cursor: pointer; font-weight: 700;">Cancel</button>
                    <button type="submit" id="submit-upload-btn" class="btn-upload" style="flex: 2; justify-content: center;">Upload File</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <div class="confirm-icon">
                <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <h2 id="confirm-title" style="color: white; font-size: 20px; margin-bottom: 10px;">Are you sure?</h2>
            <p id="confirm-msg" style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">This action cannot be undone.</p>
            <div style="display: flex; gap: 12px;">
                <button id="confirm-cancel-btn" style="flex: 1; padding: 12px; border-radius: 10px; background: transparent; border: 1px solid var(--glass-border); color: white; cursor: pointer; font-weight: 700;">Cancel</button>
                <button id="confirm-ok-btn" style="flex: 1; padding: 12px; border-radius: 10px; background: var(--btn-red); border: none; color: white; cursor: pointer; font-weight: 700;">Delete</button>
            </div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div id="preview-modal">
        <header class="preview-header">
            <div>
                <h2 id="preview-title" style="color: white; font-size: 18px; font-weight: 700;">File Preview</h2>
                <p id="preview-meta" style="color: var(--text-muted); font-size: 12px;"></p>
            </div>
            <button class="btn-close-preview" onclick="closePreview()">Close Preview</button>
        </header>
        <div class="preview-content">
            <iframe id="preview-frame" class="preview-frame" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Frontend JS Layer Script Loaders -->
    <script src="docs_state.js"></script>
    <script src="docs_gdrive.js"></script>
    <script src="docs_draft.js"></script>
    <script src="docs_view.js"></script>
    <script src="docs_main.js"></script>

    <script>
        function closePreview() {
            const modal = document.getElementById('preview-modal');
            const frame = document.getElementById('preview-frame');
            if (modal) modal.style.display = 'none';
            if (frame) frame.src = 'about:blank';
        }
    </script>
</body>

</html>
