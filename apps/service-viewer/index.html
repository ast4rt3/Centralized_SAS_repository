<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Explorer — NBSC SAS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    :root {
      --blue: #003366; --gold: #ffd700; --dark: #001a33;
      --bg: #f8fafc; --card: #fff; --border: #e2e8f0;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
      --font: 'Outfit', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px 16px 60px;
      background: linear-gradient(135deg, var(--blue), var(--dark));
      color: #fff; box-shadow: var(--shadow); z-index: 10; flex-shrink: 0;
    }
    .header-brand { display: flex; align-items: center; gap: 14px; }
    .header-logo { width: 44px; height: auto; }
    .header-text h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
    .header-text p { font-size: .75rem; font-weight: 600; color: var(--gold); }

    .nav-bar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 15px;
    }
    .btn-back {
      background: none; border: none; color: var(--blue); font-family: var(--font);
      font-weight: 700; font-size: .9rem; cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .btn-back:hover { text-decoration: underline; }
    .breadcrumb { font-size: .9rem; font-weight: 600; color: #64748b; }

    .app-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 30px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Category View */
    .category-view { display: none; }
    .category-view.active { display: block; animation: fadeIn 0.3s ease; }
    .category-header { margin-bottom: 25px; }
    .category-header h2 { font-size: 2rem; font-weight: 800; color: var(--blue); }
    
    .offices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
    .office-card {
      background: var(--card); border-radius: 20px; border: 1px solid var(--border);
      overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: 0.3s;
      display: flex; flex-direction: column;
    }
    .office-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: var(--shadow-lg); }
    
    .office-card-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border); }
    .office-card-body { padding: 25px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .office-card-body h3 { font-size: 1.25rem; font-weight: 800; color: var(--blue); }
    .office-card-body p { font-size: .95rem; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    
    .office-card-footer { padding: 0 25px 25px 25px; margin-top: auto; }
    .learn-more { color: var(--gold); font-weight: 700; font-size: .9rem; display: flex; align-items: center; gap: 6px; }
    .learn-more i { transition: 0.2s; }
    .office-card:hover .learn-more i { transform: translateX(5px); }

    /* Office Details View */
    .office-view { display: none; }
    .office-view.active { display: flex; flex-direction: column; gap: 25px; animation: fadeIn 0.3s ease; }
    
    .office-hero {
      width: 100%;
      height: 250px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: var(--dark);
      margin-bottom: 5px;
      border: 1px solid var(--border);
    }
    .office-hero img { width: 100%; height: 100%; object-fit: cover; }
    .office-hero-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 60%);
    }

    .office-info-card {
      background: linear-gradient(135deg, #fff, #f8fafc); border-radius: 20px;
      padding: 35px; box-shadow: var(--shadow); border: 1px solid var(--border);
      position: relative; z-index: 2; margin-top: -60px; width: 92%; margin-left: auto; margin-right: auto;
    }
    .office-title { font-size: 2.2rem; font-weight: 800; color: var(--blue); margin-bottom: 10px; }
    .office-info { font-size: 1.1rem; color: #475569; line-height: 1.6; }
    
    .office-body-card {
      background: #fff; border-radius: 16px; padding: 30px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .section-title { font-size: 1.3rem; font-weight: 800; color: var(--blue); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .office-body-content { font-size: 1rem; color: #334155; line-height: 1.7; white-space: pre-wrap; }

    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

    .docs-list { display: flex; flex-direction: column; gap: 10px; }
    .doc-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      text-decoration: none; color: var(--dark); font-weight: 600; font-size: .95rem; transition: 0.2s;
    }
    .doc-item:hover { background: #e2e8f0; }
    .doc-item i { color: #dc2626; font-size: 1.4rem; }

    .export-card { background: #fff; border-radius: 16px; padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 15px; }
    .btn-export { background: var(--blue); color: #fff; padding: 10px 20px; border-radius: 10px; border: none; font-family: var(--font); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-export:hover { background: var(--dark); }

    .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Career View Styles */
    .career-view { display: none; flex-direction: column; gap: 20px; padding: 0 40px 40px 40px; animation: fadeIn 0.3s; }
    .career-view.active { display: flex; }
    
    .career-header { text-align: center; margin-top: 20px; margin-bottom: 10px; }
    .career-header h2 { font-size: 2.2rem; font-weight: 800; color: var(--blue); margin: 0; }
    .career-header p { color: var(--text-sec); font-size: 1.1rem; margin-top: 5px; }

    .month-tabs { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; }
    .month-tab { padding: 12px 24px; background: #fff; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; white-space: nowrap; font-weight: 800; color: var(--text-sec); transition: 0.2s; font-size: 0.95rem; }
    .month-tab:hover { background: #f8fafc; border-color: var(--blue); color: var(--blue); }
    .month-tab.active { background: linear-gradient(135deg, var(--blue) 0%, var(--dark) 100%); color: #fff; border-color: var(--blue); box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2); }
    
    .vacancy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    .vacancy-card { border-radius: 20px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); cursor: pointer; transition: 0.3s; border: 1px solid var(--border); }
    .vacancy-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: var(--gold); }
    .vacancy-card img { width: 100%; height: 350px; object-fit: contain; background: #f1f5f9; border-bottom: 1px solid var(--border); }
    .vacancy-card-footer { padding: 18px; text-align: center; font-weight: 800; color: var(--blue); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Lightbox Modal */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 26, 51, 0.95); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); object-fit: contain; }
    .lightbox-close { position: absolute; top: 25px; right: 40px; font-size: 3rem; color: #fff; cursor: pointer; transition: 0.2s; line-height: 1; }
    .lightbox-close:hover { color: var(--gold); transform: scale(1.1) rotate(90deg); }

    @media (max-width: 768px) { 
      .grid-2col { grid-template-columns: 1fr; }
      .career-view { padding: 0 20px 20px 20px; }
      .month-tabs { padding-bottom: 10px; }
      .vacancy-card img { height: 250px; }
    }
  </style>
  <script src="../../src/core/global-presence.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <img src="../../assets/sas_logo_real.png" class="header-logo" alt="NBSC Logo">
      <div class="header-text">
        <h1>Service Explorer</h1>
        <p>SAS Portal</p>
      </div>
    </div>
  </header>

  <div class="nav-bar" id="nav-bar" style="display:none;">
    <button class="btn-back" id="btn-back"><i class='bx bx-left-arrow-alt'></i> Back</button>
    <div class="breadcrumb" id="breadcrumb">Category</div>
  </div>

  <main class="app-content">
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
    </div>

    <!-- Category View: List of Offices -->
    <div class="category-view" id="category-view">
      <div class="category-header">
        <h2 id="category-title">Services</h2>
      </div>
      <div class="offices-grid" id="offices-grid"></div>
    </div>

    <!-- Office Details View -->
    <div class="office-view" id="office-view">
      <div class="office-hero" id="office-hero">
        <img id="office-cover-img" src="../../assets/SAS_landing_page_header.jpg" alt="Office Cover">
        <div class="office-hero-overlay"></div>
      </div>
      <div class="office-info-card">
        <h2 class="office-title" id="office-title">Office Name</h2>
        <div class="office-info" id="office-info">Information overview...</div>
      </div>

      <div class="office-body-card">
        <h3 class="section-title"><i class='bx bx-info-circle'></i> About Us</h3>
        <div class="office-body-content" id="office-body">Detailed description goes here.</div>
      </div>

      <div class="grid-2col">
        <div class="office-body-card">
          <h3 class="section-title"><i class='bx bx-folder-open'></i> Public Documents</h3>
          <div class="docs-list" id="docs-list">
            <div style="color:#64748b; font-size:.9rem;">No documents available.</div>
          </div>
        </div>

        <div class="office-body-card">
          <h3 class="section-title"><i class='bx bx-time-five'></i> Recent Activities</h3>
          <div id="activities-list" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="color:#64748b; font-size:.9rem;">No activities available.</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Career & Placement Services View -->
    <div class="career-view" id="career-view">
      <div class="career-header">
        <h2>Job Vacancies</h2>
        <p>Explore career opportunities and placement services.</p>
      </div>
      
      <!-- Month Navigation -->
      <div class="month-tabs" id="career-month-tabs">
        <!-- Tabs will be injected here -->
      </div>

      <!-- Vacancy Images Grid -->
      <div class="vacancy-grid" id="career-vacancy-grid">
        <!-- Images will be injected here -->
      </div>
    </div>

  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
    <img id="lightbox-img" src="" alt="Full size view">
  </div>


  <script type="module" src="../../src/utils/app-bridge.js"></script>
  <script type="module" src="./service_viewer.js"></script>
</body>
</html>
