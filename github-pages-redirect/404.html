<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The NBSC Student Affairs Portal has transitioned to its new permanent home. Redirecting you to the correct location.">
  <title>Redirecting to NBSC Student Affairs Portal</title>

  <!-- Connect Fonts & Boxicons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    :root {
      --lp-primary: #003366;
      --lp-accent: #f59e0b;
      --lp-bg: #0a0f1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--lp-bg);
      font-family: 'Outfit', 'Montserrat', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .sas-redirect-overlay {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.4) 0%, rgba(10, 15, 30, 0.9) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .sas-redirect-card {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: min(480px, 92vw);
      padding: 45px 35px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 50px rgba(245, 158, 11, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      animation: sasScaleUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes sasScaleUp {
      from { transform: scale(0.9) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .sas-redirect-icon-pulse {
      width: 80px;
      height: 80px;
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }

    .sas-redirect-icon-pulse i {
      font-size: 2.5rem;
      color: #f59e0b;
      animation: sasSpin 12s linear infinite;
    }

    @keyframes sasSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sas-redirect-icon-pulse::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.2);
      animation: sasPulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes sasPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffffff 60%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .sas-redirect-subtitle {
      color: var(--lp-accent);
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0 0 20px 0;
    }

    .sas-redirect-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0 0 25px 0;
    }

    .sas-redirect-text strong {
      color: #f8fafc;
    }

    .sas-redirect-target {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 14px 20px;
      width: 100%;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .sas-redirect-target span {
      color: #64748b;
      font-weight: 600;
    }

    .sas-new-url {
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sas-redirect-btn {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border: none;
      border-radius: 16px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 25px;
    }

    .sas-redirect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(245, 158, 11, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #fbbf24 0%, #ea580c 100%);
    }

    .sas-redirect-btn:active {
      transform: translateY(0);
    }

    .sas-redirect-btn i {
      font-size: 1.3rem;
      transition: transform 0.3s ease;
    }

    .sas-redirect-btn:hover i {
      transform: translateX(4px);
    }

    .sas-redirect-footer {
      width: 100%;
      margin-top: 10px;
    }

    .sas-countdown-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .sas-countdown-fill {
      height: 100%;
      width: 100%;
      background: var(--lp-accent);
      border-radius: 2px;
      transform-origin: left;
      animation: sasCountdown 10s linear forwards;
    }

    @keyframes sasCountdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    #sas-countdown-text {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
      font-weight: 600;
    }

    #sas-seconds {
      color: var(--lp-accent);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="sas-redirect-overlay" id="sas-redirect-overlay">
    <section class="sas-redirect-card">
      <div class="sas-redirect-icon-pulse">
        <i class='bx bx-world'></i>
      </div>
      <h1>We Have Moved!</h1>
      <p class="sas-redirect-subtitle">Important Update for NBSC Students & Staff</p>
      <p class="sas-redirect-text">
        The <strong>NBSC Student Affairs Portal</strong> has migrated to a new, faster, and more stable domain. 
        Please update your bookmarks to continue accessing our services.
      </p>
      <div class="sas-redirect-target">
        <span>New Address:</span>
        <strong class="sas-new-url">nbsc-sas.kesug.com</strong>
      </div>
      <a href="http://nbsc-sas.kesug.com/" id="sas-redirect-btn" class="sas-redirect-btn">
        <span>Go to New Portal</span>
        <i class='bx bx-right-arrow-alt'></i>
      </a>
      <footer class="sas-redirect-footer">
        <div class="sas-countdown-bar">
          <div class="sas-countdown-fill" id="sas-countdown-fill"></div>
        </div>
        <p id="sas-countdown-text">Redirecting automatically in <span id="sas-seconds">10</span>s...</p>
      </footer>
    </section>
  </main>

  <script>
    (function() {
      // 1. Resolve redirect target dynamically
      let targetUrl = 'http://nbsc-sas.kesug.com/';
      const repoPrefix = '/Centralized_SAS_repository';
      let path = window.location.pathname;
      if (path.startsWith(repoPrefix)) {
        path = path.substring(repoPrefix.length);
      }
      targetUrl = 'http://nbsc-sas.kesug.com' + path + window.location.search + window.location.hash;

      // 2. Set dynamic link href immediately
      const btn = document.getElementById('sas-redirect-btn');
      if (btn) btn.href = targetUrl;

      // 3. Countdown sequence
      let seconds = 10;
      const secondsSpan = document.getElementById('sas-seconds');
      const interval = setInterval(function () {
        seconds--;
        if (secondsSpan) secondsSpan.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = targetUrl;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
